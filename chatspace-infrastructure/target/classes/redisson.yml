# redisson 配置
clusterServersConfig:
  # 连接空闲超时，单位：毫秒 默认 10000
  idleConnectionTimeout: 10000
  pingTimeout: 1000
  # 同任何节点建立连接时的等待超时。时间单位是毫秒 默认 10000
  connectTimeout: 10000
  # 等待节点回复命令的时间。该时间从命令发送成功时开始计时。默认 3000
  timeout: 3000
  # 命令失败重试次数
  retryAttempts: 3
  # 命令重试发送时间间隔，单位：毫秒
  retryInterval: 1500
  # 重新连接时间间隔，单位：毫秒
  reconnectionTimeout: 3000
  # 执行失败最大次数
  failedAttempts: 3
  # 密码
  password: xiaoche
  # 单个连接最大订阅数量
  subscriptionsPerConnection: 5
  clientName: null
  # loadBalancer 负载均衡算法类的选择
  loadBalancer: !<org.redisson.connection.balancer.RoundRobinLoadBalancer> {}
  # 从节点发布和订阅连接的最小空闲连接数
  slaveSubscriptionConnectionMinimumIdleSize: 1
  # 从节点发布和订阅连接池大小 默认值 50
  slaveSubscriptionConnectionPoolSize: 50
  # 从节点最小空闲连接数 默认值 32
  slaveConnectionMinimumIdleSize: 32
  # 从节点连接池大小 默认 64
  slaveConnectionPoolSize: 64
  # 主节点最小空闲连接数 默认 32
  masterConnectionMinimumIdleSize: 32
  # 主节点连接池大小 默认 64
  masterConnectionPoolSize: 64
  # 订阅操作的负载均衡模式
  subscriptionMode: SLAVE
  # 只在从服务器读取
  readMode: SLAVE
  # 集群地址
  nodeAddresses:
    - "redis://119.91.208.25:6000"
    - "redis://119.91.210.79:6000"
    - "redis://119.91.20.241:6000"
  # 对Redis集群节点状态扫描的时间间隔。单位是毫秒。默认1000
  scanInterval: 1000
# 这个线程池数量被所有 RTopic 对象监听器，RRemoteService 调用者和 RExecutorService 任务共同共享。默认 2
threads: 0
# 这个线程池数量是在一个 Redisson 实例内，被其创建的所有分布式数据类型和服务，以及底层客户端所一同共享的线程池里保存的线程数量。默认 2
nettyThreads: 0
# 编码方式 默认org.redisson.codec.JsonJacksonCodec
codec: !<org.redisson.codec.JsonJacksonCodec> {}
# 传输模式
transportMode: NIO
# 分布式锁自动过期时间，防止死锁，默认 30000
lockWatchdogTimeout: 30000
# 通过该参数来修改是否按订阅发布消息的接收顺序出来消息，如果选否将对消息实行并行处理，该参数只适用于订阅发布消息的情况, 默认true
keepPubSubOrder: true
# 用来指定高性能引擎的行为。由于该变量值的选用与使用场景息息相关（NORMAL除外）我们建议对每个参数值都进行尝试。
# 该参数仅限于Redisson PRO 版本。
# performanceMode: HIGHER_THROUGHPUT


