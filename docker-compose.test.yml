# 测试依赖栈：Nacos + PostgreSQL + Redis + RabbitMQ
#
# 用法：
#   cp deploy/test-stack/.env.example .env        # 可选，不建也能用默认值
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml ps
#
# 首次启动 postgres 会自动执行 chatspace_pg.sql 建表（数据卷为空时）。
# 重置数据：docker compose -f docker-compose.test.yml down -v
#
# 说明见 deploy/test-stack/README.md

name: chatspace-test

services:
  # ---------------------------------------------------------------- Nacos
  # 官方镜像只有 amd64，Apple Silicon 上靠模拟运行，启动会慢一些（1~3 分钟）
  nacos:
    image: nacos/nacos-server:v2.3.0
    platform: linux/amd64
    container_name: cs-nacos
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      JVM_MS: 64m
      JVM_MMS: 128m
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
    ports:
      - "8848:8848"   # HTTP / openAPI
      - "9848:9848"   # 2.x gRPC
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8848/nacos/v1/console/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks: [chatspace-test]

  # ------------------------------------------------------------ PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: cs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: chat_space_v2
      # 中文排序/编码
      LANG: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动建库建表；文件只读挂载，改 SQL 后需 down -v 重来
      - ./chatspace_pg.sql:/docker-entrypoint-initdb.d/01_chatspace.sql:ro
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=200
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - random_page_cost=1.1
      - -c
      # 压测环境牺牲一点持久性换吞吐；正式环境请去掉
      - synchronous_commit=off
      - -c
      - log_min_duration_statement=500
    shm_size: 1gb          # shared_buffers 调大后必须一起加，否则并行查询会报错
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_space_v2"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [chatspace-test]

  # ----------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: cs-redis
    environment:
      # 供健康检查复用；真正生效的是下面 command 里的 --requirepass
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redispass}
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction        # GEO / 在线集合不能丢，宁可写失败也不要被淘汰
    ports:
      - "6379:6379"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [chatspace-test]

  # ------------------------------------------------------------- RabbitMQ
  # 挂载官方社区插件 rabbitmq_delayed_message_exchange，group 服务的延时队列依赖它
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cs-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_ENABLED_PLUGINS_FILE: /etc/rabbitmq/enabled_plugins
    ports:
      - "5672:5672"
      - "15672:15672"   # 管理台 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/test-stack/rabbitmq/rabbitmq_delayed_message_exchange-3.13.0.ez:/opt/rabbitmq/plugins/rabbitmq_delayed_message_exchange-3.13.0.ez:ro
      - ./deploy/test-stack/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./deploy/test-stack/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [chatspace-test]

volumes:
  pgdata:
  rabbitmq-data:
  nacos-data:

networks:
  chatspace-test:
    driver: bridge
