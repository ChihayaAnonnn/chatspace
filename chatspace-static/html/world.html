<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JRPG-style Adventure</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .character {
            font-weight: bold;
            color: #ffcc00;
        }
        .dialog-box {
            border: 2px solid #ffcc00;
            padding: 10px;
            margin: 20px auto;
            max-width: 600px;
        }
        .adventure-text {
            font-size: 18px;
            margin: 10px;
        }
    </style>
</head>
<body>
<div class="character">勇敢的英雄</div>
<div class="dialog-box">
    <div class="adventure-text">
        勇敢的英雄站在古老的城堡前，准备面对未知的挑战。城堡内传来可怕的咆哮声。
    </div>
</div>

<div class="character">神秘的法师</div>
<div class="dialog-box">
    <div class="adventure-text">
        神秘的法师走了过来，向英雄提供了一本古老的魔法书，上面写着一种强大的咒语。
    </div>
</div>

<div class="character">任务提示</div>
<div class="dialog-box">
    <div class="adventure-text">
        你的任务是消灭城堡内的恶龙，拯救这个王国。你可以选择使用法师的咒语或者挥舞自己的剑。
    </div>
</div>

<!-- 这里可以添加更多的文本和元素，以展开故事情节。 -->

</body>
</html>
