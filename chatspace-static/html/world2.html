<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JRPG风格背包物品栏</title>
    <style>
        .inventory {
            display: grid;
            grid-template-columns: repeat(5, 100px);
            gap: 10px;
        }

        .item {
            width: 100px;
            height: 100px;
            border: 2px solid #000;
            background-color: #fff;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            position: relative;
        }

        .item:hover {
            background-color: #f0f0f0;
        }

        .item img {
            max-width: 80px;
            max-height: 80px;
            margin: 10px;
        }

        #addItem {
            width: 100px;
            height: 100px;
            border: 2px dashed #000;
            background-color: #fff;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            position: relative;
        }

        #addItem:hover {
            background-color: #f0f0f0;
        }

        #itemDetails {
            display: none;
            position: absolute;
            top: 120px;
            left: 0;
            background-color: #f0f0f0;
            border: 2px solid #000;
            padding: 10px;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="inventory">
    <!-- 使用循环显示物品格子 -->
    <div class="item" onmouseover="showItemDetails(this)" onmouseout="hideItemDetails()">
        <img src="item1.png" alt="物品1">
    </div>
    <div class="item" onmouseover="showItemDetails(this)" onmouseout="hideItemDetails()">
        <img src="item2.png" alt="物品2">
    </div>
    <div class="item" onmouseover="showItemDetails(this)" onmouseout="hideItemDetails()">
        <img src="item3.png" alt="物品3">
    </div>
    <!-- 增加物品的格子 -->
    <div id="addItem" onclick="showAddItemModal()">
        +
    </div>
</div>

<div id="itemDetails">
    <img id="itemImage" src="" alt="物品">
    <p id="itemName">物品名称</p>
    <p id="itemDescription">物品描述</p>
</div>

<!-- 添加物品的模态框 -->
<div id="addNewItemModal" class="modal">
    <div class="modal-content">
        <h2>添加新物品</h2>
        <input type="file" accept="image/*" id="newItemImage" />
        <input type="text" id="newItemName" placeholder="物品名称" />
        <textarea id="newItemDescription" placeholder="物品描述"></textarea>
        <button onclick="addItem()">添加</button>
        <button onclick="hideAddItemModal()">取消</button>
    </div>
</div>

<script>
    // 物品数组，每个对象包含物品信息
    const items = [
        { name: "物品1", description: "这是物品1的描述" },
        { name: "物品2", description: "这是物品2的描述" },
        { name: "物品3", description: "这是物品3的描述" },
    ];

    function showItemDetails(item) {
        const itemIndex = Array.from(item.parentElement.children).indexOf(item);
        const itemDetail = document.getElementById("itemDetails");
        const itemImage = document.getElementById("itemImage");
        const itemName = document.getElementById("itemName");
        const itemDescription = document.getElementById("itemDescription");

        if (itemIndex < items.length) {
            const selectedItem = items[itemIndex];
            itemImage.src = `item${itemIndex + 1}.png`; // 替换为实际的图片路径
            itemName.textContent = selectedItem.name;
            itemDescription.textContent = selectedItem.description;
            itemDetail.style.display = "block";
        }
    }

    function hideItemDetails() {
        const itemDetail = document.getElementById("itemDetails");
        itemDetail.style.display = "none";
    }

    function showAddItemModal() {
        const addItemModal = document.getElementById("addNewItemModal");
        addItemModal.style.display = "block";
    }

    function hideAddItemModal() {
        const addItemModal = document.getElementById("addNewItemModal");
        addItemModal.style.display = "none";
    }

    function addItem() {
        const newItemImageInput = document.getElementById("newItemImage");
        const newItemNameInput = document.getElementById("newItemName");
        const newItemDescriptionInput = document.getElementById("newItemDescription");

        const newItemImage = newItemImageInput.value;
        const newItemName = newItemNameInput.value;
        const newItemDescription = newItemDescriptionInput.value;

        if (newItemImage && newItemName && newItemDescription) {
            const newItem = {
                name: newItemName,
                description: newItemDescription,
            };

            items.push(newItem);

            // 创建新的物品格子并添加到物品栏
            const newInventoryItem = document.createElement("div");
            newInventoryItem.className = "item";
            newInventoryItem.onmouseover = function() {
                showItemDetails(newInventoryItem);
            };
            newInventoryItem.onmouseout = hideItemDetails;

            const newItemImageElement = document.createElement("img");
            newItemImageElement.src = newItemImage;
            newItemImageElement.alt = newItemName;
            newInventoryItem.appendChild(newItemImageElement);

            const inventory = document.querySelector(".inventory");
            inventory.insertBefore(newInventoryItem, document.getElementById("addItem"));

            hideAddItemModal();
        }
    }
</script>
</body>
</html>
