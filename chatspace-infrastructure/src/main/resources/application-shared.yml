spring:
  datasource:
    # PostgreSQL（默认本机 127.0.0.1:5432，可用 PG_HOST / PG_PORT / PG_DB / PG_USER / PG_PASSWORD 覆盖）
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DB:chat_space_v2}"
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # wall 过滤器对 PG 的 ->> 等语法支持不完整，压测期间先只开 stat
      filters: [stat]
      web-stat-filter:
        enabled: on
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        session-stat-enable: true
      stat-view-servlet:
        enabled: on
        url-pattern: /druid/*
        reset-enable: false
        login-password: aaa
        login-username: iceclean
        allow: 127.0.0.1
  redis:
    host: 10.0.24.17
    port: 6000
    password: Xiaoche423
    lettuce:
      pool:
        max-idle: 16
        max-active: 8
        max-wait: 10000
        min-idle: 8
  mail:
    username: 1419263382@qq.com
    password: qimywefiificghah
    host: smtp.qq.com
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
