<!-- HTML 页面 -->
<html>
<head>
    <title>WebRTC Voice Chat</title>
</head>
<body>
<!-- 语音聊天界面 -->
<div id="voice-chat-container">
    <!-- 展示连接的用户列表 -->
    <div id="connected-users"></div>
    <!-- 展示麦克风音量大小的进度条 -->
    <progress id="mic-volume" max="100" value="0"></progress>
    <!-- 显示麦克风的状态 -->
    <div id="mic-status">Mic: Off</div>
    <!-- 显示扬声器的状态 -->
    <div id="speaker-status">Speaker: Off</div>
    <!-- 按钮，用于控制麦克风的开关 -->
    <button id="toggle-mic">Toggle Mic</button>
    <!-- 按钮，用于控制扬声器的开关 -->
    <button id="toggle-speaker">Toggle Speaker</button>
    <!-- 按钮，用于结束通话 -->
    <button id="hangup">Hang Up</button>
</div>
<!-- 输入用户名的输入框 -->
<input type="text" id="username" placeholder="Enter your name">
<!-- 按钮，用于连接到服务器 -->
<button id="connect">Connect</button>
<!-- 引入 WebRTC 库 -->
<script src="https://cdn.jsdelivr.net/npm/webrtc-adapter@latest/out/adapter.min.js"></script>
<!-- 引入自定义 JavaScript 文件 -->
<script src="client.js"></script>
</body>
</html>
